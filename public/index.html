<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Games</title>
<link rel="icon" type="image/svg+xml" href="img/logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--sp:cubic-bezier(.32,1.5,.5,1)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% 20%,#262e63,#05060e 75%) fixed;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
.blobs{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.blobs i{position:absolute;width:42vmax;height:42vmax;border-radius:50%;background:var(--c);filter:blur(100px);opacity:.28;animation:fl 12s ease-in-out infinite alternate}@keyframes fl{to{transform:translate(8vmax,6vmax) scale(1.2)}}
main{position:relative;width:min(440px,100%);text-align:center}
h1{margin:0;font-size:44px;font-weight:800;letter-spacing:-1.8px;background:linear-gradient(180deg,#fff,#9aa0c0);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{opacity:.55;margin:6px 0 26px;font-size:15px}
.grid{display:flex;flex-direction:column;gap:14px}
.game{display:flex;align-items:center;gap:16px;padding:16px;text-align:left;color:inherit;text-decoration:none;position:relative;background:rgba(28,30,46,.5);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border:.5px solid rgba(255,255,255,.2);border-radius:24px;box-shadow:0 12px 40px rgba(0,0,0,.4),inset 0 .5px 0 rgba(255,255,255,.25);transition:transform .35s var(--sp);animation:up .7s var(--sp) both}
.game:nth-child(2){animation-delay:.08s}
@keyframes up{from{transform:translateY(30px) scale(.95);opacity:0}}
a.game:active{transform:scale(.97)}
.art{flex:none;width:84px;height:84px;border-radius:22px;display:flex;align-items:center;justify-content:center;overflow:hidden;filter:drop-shadow(0 8px 18px rgba(0,0,0,.4))}
.art img,.art svg{width:100%;height:100%;display:block}
.info{flex:1;min-width:0}
h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.5px}
p{margin:4px 0 0;font-size:13px;line-height:1.35;opacity:.6}
.act{flex:none;border-radius:999px;padding:9px 18px;background:#0a84ff;font-weight:600;font-size:14px;box-shadow:0 6px 18px rgba(10,132,255,.45)}
.tag{flex:none;border-radius:999px;padding:6px 12px;background:rgba(255,255,255,.12);font-weight:600;font-size:12px;opacity:.85}

@media(min-width:720px){
 main{width:min(760px,100%)}h1{font-size:56px}
 .grid{flex-direction:row;gap:18px}
 .game{flex:1;flex-direction:column;text-align:center;padding:30px 20px 24px;gap:14px}
 .art{width:104px;height:104px;border-radius:26px}
}
</style></head><body>
<div class="blobs"><i style="--c:#fbc916;top:-10vmax;left:-8vmax"></i><i style="--c:#22c55e;top:-6vmax;right:-10vmax"></i><i style="--c:#ef4444;bottom:-12vmax;right:-6vmax"></i><i style="--c:#3b82f6;bottom:-10vmax;left:-10vmax"></i></div>
<main>
<h1>Pick a game</h1><div class="sub">Play with friends or against the computer</div>
<div class="grid">
 <a class="game" href="ludo.html"><div class="art"><img src="img/logo.svg" alt=""></div><div class="info"><h2>Ludo</h2></div><span class="act">Play</span></a>
 <a class="game" href="jutpatti.html"><div class="art"><img src="img/jutpatti.svg" alt=""></div><div class="info"><h2>Jutpatti</h2><p>Nepali pair-making card game · 2–6 players</p></div><span class="act">Play</span></a>
</div>
</main>
</body></html>
